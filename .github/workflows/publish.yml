name: Release & Publish Apify OpenCode Plugin

# Started by `release-published.yml`, so that it runs from main and can use the environment that holds the token.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string
      target-branch:
        description: Branch that receives the version bump commit
        required: false
        type: string
        default: main

permissions:
  id-token: write
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    environment:
      name: npm
      deployment: false

    steps:
      # The tag's code runs with the token below, so it has to be code that already went through main.
      - name: Check that the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...refs/tags/${TAG}" --jq .status)
          if [[ "$status" != "identical" && "$status" != "behind" ]]; then
            echo "::error::${TAG} is not on main"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js & cache npm
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build project
        run: npm run build

      - name: Verify plugin assets exist
        run: |
          test -f agents/apify.md
          test -f instructions/apify-routing.md
          test -d skills

      - name: Extract release version
        id: get_version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          FULL_TAG_NAME="$TAG"
          VERSION_NUMBER="${FULL_TAG_NAME#v}"
          echo "VERSION=${VERSION_NUMBER}" >> $GITHUB_ENV

      - name: Update package.json version
        run: |
          echo "Updating package.json to version $VERSION"
          npm version "$VERSION" --no-git-tag-version

      - name: Commit version update
        uses: apify/actions/signed-commit@v1.1.2
        with:
          message: "chore(release): set version to ${{ env.VERSION }} [skip ci]"
          add: 'package.json'
          github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          branch: ${{ inputs.target-branch }}

      - name: Publish to npm
        run: |
          if npm view opencode-apify@"$VERSION" version > /dev/null 2>&1; then
            echo "Version $VERSION of opencode-apify is already published to npm. Skipping publish step."
          else
            echo "Publishing opencode-apify@$VERSION to npm..."
            npm publish --provenance --access public
          fi
